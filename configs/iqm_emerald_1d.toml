# 1D chains on IQM Emerald through Amazon Braket (AWS credentials in the environment), from 5 nodes
# to the longest chain in steps of 5. Today's coupling map has a 51-qubit line (coupler (49, 53) is
# off, so the stored Emerald line no longer fits and one is found in the coupling map), so 50 is the
# largest size. Short chains run several copies side by side along the line. Depths and delta match
# the earlier run (Data/iqm_emerald/5_1D_aws.npy). The whole sweep is one Braket submission; each
# circuit must stay under Braket's 10,000 native gates for IQM (checked before submitting).
backend = "iqm_emerald"
topology = "1D"
nq = [5, 10, 15, 20, 25, 30, 35, 40, 45, 50]
ps = [3, 5, 7, 10, 13, 15, 20]
deltas = [1.0]
shots = 1000
tag = "_2026"   # 5_1D.npy already holds the earlier run; list the new files under extra_files

[provider]
kind = "braket"
device = "Emerald"
