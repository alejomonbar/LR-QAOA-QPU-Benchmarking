# Native layout: the problem graph is the device coupling map (whole chip, no routing).
# The problem comes from Data/NL-problems.npy (one per processor family).
backend = "ibm_phoenix"
topology = "NL"
ps = [3, 4, 5, 6, 7, 8, 9, 10, 13, 15, 20, 25, 30, 40, 50, 75, 100]
deltas = [0.75]

[provider]
kind = "ibm"
service = "mcm-primitives"
